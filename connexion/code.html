<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080c18">
  <meta name="description" content="Connectez-vous à votre espace Zoomc E-Bike. Roulez plus loin.">
  <title>Connexion Zoomc E-Bike — NARKE</title>
  <link rel="stylesheet" href="/connexion/auth.css">
</head>
<body>
  <main class="auth-page">
    <div class="hero-art" aria-hidden="true">
      <img class="hero-image" src="/pages/assets/zoomc-login-scene.webp" alt="">
    </div>
    <div class="scene-shade" aria-hidden="true"></div>

    <header class="brand-lockup">
      <img src="/pages/assets/zoomc-login-logo.webp" alt="Zoomc E-Bike — Roulez plus loin">
    </header>

    <section class="auth-card" aria-labelledby="page-title">
      <div class="card-heading">
        <h1 id="page-title">Connexion à votre <em>compte</em></h1>
        <p class="auth-subtitle">Accédez à votre espace Zoomc E-Bike</p>
      </div>
      <div class="auth-panel">
      <form data-auth-form="login">
        <label class="sr-only" for="login-country">Pays</label>
        <button class="field country-trigger" id="login-country" type="button" aria-haspopup="dialog" aria-controls="country-dialog" aria-describedby="country-loading" aria-expanded="false">
          <span class="field-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8.8"/><path d="M3.5 12h17M12 3.2c2.2 2.4 3.2 5.3 3.2 8.8s-1 6.4-3.2 8.8C9.8 18.4 8.8 15.5 8.8 12s1-6.4 3.2-8.8Z"/></svg>
          </span>
          <span class="field-value" data-country-label>Sélectionnez votre pays</span>
          <svg class="dropdown-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="m4 7 6 6 6-6"/></svg>
        </button>
        <input type="hidden" name="country" required>

        <label class="sr-only" for="login-phone">Numéro de téléphone</label>
        <div class="field phone-field">
          <span class="field-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none"><path d="M7.2 3.8 9.8 7l-1.7 2.5a15.3 15.3 0 0 0 6.4 6.4l2.5-1.7 3.2 2.6-.8 3.2c-.2.8-1 1.3-1.8 1.2C9.8 20 4 14.2 2.8 6.4c-.1-.8.4-1.6 1.2-1.8l3.2-.8Z"/></svg>
          </span>
          <span class="phone-prefix" data-phone-prefix aria-hidden="true"></span>
          <input class="field phone-input" id="login-phone" name="phone" type="tel" inputmode="tel" autocomplete="tel-national" placeholder="Votre numéro de téléphone" required>
        </div>

        <label class="sr-only" for="login-password">Mot de passe</label>
        <div class="field password-field">
          <span class="field-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none"><rect x="4.3" y="10" width="15.4" height="11" rx="1.8"/><path d="M7.7 10V7.4a4.3 4.3 0 0 1 8.6 0V10M12 14v3"/></svg>
          </span>
          <input class="field" id="login-password" name="password" type="password" autocomplete="current-password" placeholder="Votre mot de passe" required>
          <button class="password-toggle" type="button" data-password-toggle aria-pressed="false" aria-controls="login-password" aria-label="Afficher le mot de passe">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M2.5 12s3.4-6 9.5-6 9.5 6 9.5 6-3.4 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.8"/><path d="m4 4 16 16"/></svg>
          </button>
        </div>

        <label class="remember-row"><input type="checkbox" name="remember"> <span>Rester connecté pendant 7 jours</span></label>

        <button class="primary-button" type="submit">
          <span>Se connecter</span>
          <span class="submit-arrow" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M4.5 12h14m-6-6 6 6-6 6"/></svg></span>
        </button>
        <div class="form-divider" aria-hidden="true"><span></span><b>ou</b><span></span></div>
        <p class="switch-copy">Pas encore de compte ? <a href="/inscription">Créer un compte</a></p>
      </form>
      <p class="demo-notice" role="status" aria-live="polite"></p>
      </div>
    </section>

    <footer class="benefits" aria-label="Les avantages Zoomc E-Bike">
      <div class="benefit">
        <span class="benefit-symbol bolt" aria-hidden="true">↯</span>
        <p>Mobilité électrique<br><strong>sans effort</strong></p>
      </div>
      <span class="benefit-rule" aria-hidden="true"></span>
      <div class="benefit">
        <svg class="benefit-symbol shield" viewBox="0 0 32 36" fill="none" aria-hidden="true"><path d="M16 2 28 7v9c0 8-4.8 14-12 18C8.8 30 4 24 4 16V7l12-5Z"/><path d="m10 17 4 4 8-9"/></svg>
        <p>Sécurité garantie<br><strong>à chaque trajet</strong></p>
      </div>
      <span class="benefit-rule" aria-hidden="true"></span>
      <div class="benefit">
        <svg class="benefit-symbol leaf" viewBox="0 0 36 36" fill="none" aria-hidden="true"><path d="M30 5C17 5 7 8 5 19c-1 6 3 10 8 9 11-2 14-12 17-23Z"/><path d="M4 32c5-9 11-14 20-20"/></svg>
        <p>Un avenir durable<br><strong>pour tous</strong></p>
      </div>
    </footer>
  </main>

  <div class="country-overlay" data-country-overlay hidden>
    <section class="country-sheet" id="country-dialog" role="dialog" aria-modal="true" aria-labelledby="country-title" tabindex="-1">
      <header class="sheet-header">
        <button type="button" class="sheet-back" data-country-close aria-label="Fermer">‹</button>
        <h2 id="country-title">Sélectionnez votre pays</h2>
        <span class="sheet-spacer"></span>
      </header>
      <div class="country-loading" data-country-loading role="status" aria-live="polite">
        <span class="country-spinner" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></span>
        <span class="country-dots" aria-hidden="true"><span></span><span></span><span></span></span>
        <span class="sr-only">Ouverture de la liste des pays…</span>
      </div>
      <div class="country-options" hidden>
        <button type="button" class="country-option" data-country-code="+228" data-country-name="Togo"><span>+228</span><span>Togo</span></button>
        <button type="button" class="country-option" data-country-code="+225" data-country-name="Côte d’Ivoire"><span>+225</span><span>Côte d’Ivoire</span></button>
        <button type="button" class="country-option" data-country-code="+229" data-country-name="Bénin"><span>+229</span><span>Bénin</span></button>
        <button type="button" class="country-option" data-country-code="+226" data-country-name="Burkina Faso"><span>+226</span><span>Burkina Faso</span></button>
        <button type="button" class="country-option" data-country-code="+227" data-country-name="Niger"><span>+227</span><span>Niger</span></button>
        <button type="button" class="country-option" data-country-code="+237" data-country-name="Cameroun"><span>+237</span><span>Cameroun</span></button>
      </div>
      <div class="country-error" data-country-error hidden role="alert">
        <p data-country-message></p>
        <button type="button" data-country-retry>Réessayer</button>
      </div>
    </section>
  </div>
  <script src="/pages/country-picker.js" defer></script>
  <script src="/pages/auth-progress.js" defer></script>
  <script src="/connexion/auth.js" defer></script>
</body>
</html>
