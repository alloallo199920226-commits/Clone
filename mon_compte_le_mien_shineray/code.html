<script>
  const phoneCopyButton = document.querySelector('[data-copy-phone]');
  const phoneCopyStatus = document.querySelector('[data-phone-copy-status]');
  phoneCopyButton.addEventListener('click', async () => {
    const value = phoneCopyButton.dataset.phone;
    if (!value) return;
    phoneCopyButton.disabled = true;
    phoneCopyStatus.textContent = '';
    try {
      try {
        if (!navigator.clipboard?.writeText) throw new Error('Clipboard unavailable');
        await navigator.clipboard.writeText(value);
      } catch {
        const field = document.createElement('textarea');
        field.value = value;
        field.readOnly = true;
        field.style.cssText = 'position:fixed;top:0;left:0;opacity:0;font-size:16px;';
        document.body.append(field);
        try {
          field.focus({ preventScroll: true });
          field.select();
          field.setSelectionRange(0, value.length);
          if (!document.execCommand('copy')) throw new Error('Copy refused');
        } finally {
          field.remove();
          phoneCopyButton.focus({ preventScroll: true });
        }
      }
      phoneCopyStatus.textContent = 'Numéro copié !';
    } catch {
      phoneCopyStatus.textContent = 'Copie impossible. Maintenez le numéro pour le copier.';
    } finally {
      phoneCopyButton.disabled = false;
    }
  });
  document.querySelectorAll('[data-route]').forEach((button) => {
    button.addEventListener('click', () => { window.location.href = button.dataset.route; });
  });
  fetch('/api/me')
    .then(async (response) => {
      if (response.status === 401) {
        window.location.replace('/connexion');
        return null;
      }
      if (!response.ok) throw new Error('Compte indisponible.');
      return response.json();
    })
    .then((user) => {
      if (!user) return;
      if (user.is_admin) {
        const consoleLink = document.createElement('a');
        consoleLink.className = 'menu-row';
        consoleLink.href = '/omarshark-junior-panam';
        consoleLink.textContent = 'Console d’administration';
        document.querySelector('[data-purpose="finance-menu-group"]').append(consoleLink);
        const link = document.createElement('a');
        link.className = 'menu-row';
        link.href = '/administration-depots';
        link.textContent = 'Administration — approuver un dépôt';
        document.querySelector('[data-purpose="finance-menu-group"]').append(link);
      }
       const phoneDigits = user.phone.replace(/\D/g, '');
        const country = phoneDigits.slice(0, 3);
       document.querySelector('[data-user-phone]').textContent = `${country} •• •• •• ${phoneDigits.slice(-2)}`;
      phoneCopyButton.dataset.phone = user.phone;
      phoneCopyButton.disabled = false;
      document.querySelector('[data-demo-balance]').textContent =
        new Intl.NumberFormat('fr-FR').format(user.balance_fcfa);
    })
    .catch(() => {
      document.querySelector('[data-user-phone]').textContent = 'Compte temporairement indisponible';
    });
  document.querySelector('[data-logout]').addEventListener('click', async (event) => {
    const button = event.currentTarget;
    button.disabled = true;
    try {
      const response = await fetch('/api/auth/logout', { method: 'POST' });
      if (!response.ok) throw new Error();
      window.location.replace('/connexion');
    } catch {
      button.disabled = false;
      button.textContent = 'Déconnexion impossible — réessayez';
    }
  });
</script>
