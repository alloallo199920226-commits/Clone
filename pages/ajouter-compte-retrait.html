<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ajouter un compte de retrait — SHINERAY</title><link rel="stylesheet" href="/pages/pages.css"><script src="/pages/pages.js" defer></script></head>
<body><main class="page"><header class="page-header"><a class="back" href="/gestion-compte-bancaire" aria-label="Retour">‹</a><h1>Ajouter un compte de retrait</h1><span class="header-spacer"></span></header><div class="page-content">
<form data-wallet-form><label class="field-label" for="wallet-type">*Sélectionnez le type de portefeuille</label><select class="select" id="wallet-type" name="provider" required><option value="">Veuillez sélectionner</option><option value="TOGOCEL">TOGOCEL</option></select>
<label class="field-label" for="wallet-number">*Compte portefeuille</label><input class="input" id="wallet-number" name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="Veuillez saisir votre compte portefeuille" required>
<p class="hint">Votre numéro est enregistré dans votre compte. Ne saisissez jamais votre code secret Mobile Money.</p>
<button class="button-red button-wide" type="submit" style="max-width:258px;display:block;margin:52px auto 0">Ajouter</button><p class="status" data-status role="status" aria-live="polite"></p></form></div></main></body></html>
