<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="Ajoutez un compte de retrait à votre espace membre E-BIKE Pro."><meta name="theme-color" content="#112840"><title>Ajouter un compte de retrait — E-BIKE Pro</title>
<link rel="stylesheet" href="/pages/pages.css"><link rel="stylesheet" href="/pages/narke-suite.css"><link rel="stylesheet" href="/pages/member-reference.css"><link rel="stylesheet" href="/pages/narke-wallet-form.css"><script src="/pages/pages.js" defer></script></head>
<body class="ep-finance ep-wallet-form-page narke-suite-page narke-record-page narke-wallet-form-page"><main class="page wallet-page">
  <header class="page-header wallet-header"><a class="back" href="/gestion-compte-bancaire" aria-label="Retour aux comptes de retrait">←</a><a class="wallet-brand" href="/gestion-compte-bancaire" aria-label="E-BIKE Pro — comptes de retrait"><img class="narke-header-mark" src="/pages/assets/ebike-logo.png" alt="E-BIKE Pro"></a><span class="wallet-header-label">ESPACE MEMBRE</span></header>
  <div class="wallet-content"><div class="wallet-stage">
    <aside class="wallet-scene"><img src="/pages/assets/ebike-precision.jpg" alt="" aria-hidden="true"><div class="wallet-scene-copy"><p class="narke-kicker">COORDONNÉES / NOUVEAU MOYEN</p><h1 id="wallet-page-title">Un compte.<br><span>À votre nom.</span></h1><p>Enregistrez le portefeuille que vous utiliserez pour vos retraits.</p></div><span class="scene-index">E-BIKE PRO / W</span></aside>
    <form class="wallet-form narke-form-panel" data-wallet-form aria-label="Ajouter un compte de retrait">
      <header class="narke-panel-heading"><div><p class="narke-kicker">VOTRE CARNET DE VERSEMENT</p><h2>Renseignez vos coordonnées</h2></div><span class="narke-live-mark">01</span></header>
      <div class="wallet-fields">
        <div class="wallet-field wallet-field-provider"><label class="field-label" for="wallet-type">Type de portefeuille <span aria-hidden="true">*</span></label><select class="select" id="wallet-type" name="provider" required><option value="">Veuillez sélectionner</option><option value="TOGOCEL">TOGOCEL</option><option value="MOOV">Moov</option><option value="MTN">MTN</option><option value="ORANGE">Orange</option><option value="AIRTEL">Airtel</option><option value="WAVE">Wave</option></select></div>
        <div class="wallet-field"><label class="field-label" for="wallet-holder">Nom du titulaire <span aria-hidden="true">*</span></label><input class="input" id="wallet-holder" name="holder_name" type="text" autocomplete="name" maxlength="120" placeholder="Nom tel qu’enregistré auprès de l’opérateur" required></div>
        <div class="wallet-field"><label class="field-label" for="wallet-number">Numéro du portefeuille <span aria-hidden="true">*</span></label><input class="input" id="wallet-number" name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="Numéro local ou avec l’indicatif du pays" required></div>
      </div>
      <button class="button-red button-wide wallet-submit" type="submit">Enregistrer ces coordonnées <span aria-hidden="true">→</span></button><p class="status narke-record-status" data-status role="status" aria-live="polite"></p>
      <a class="wallet-cancel" href="/gestion-compte-bancaire">Annuler et revenir aux comptes</a>
    </form>
  </div><p class="wallet-footnote"><span aria-hidden="true">E</span> E-BIKE PRO <i aria-hidden="true"></i> COORDONNÉES DE RETRAIT</p></div>
</main></body></html>
