<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ajouter un compte de retrait — IVECO</title><link rel="stylesheet" href="/pages/pages.css"><link rel="stylesheet" href="/pages/member-reference.css"><script src="/pages/pages.js" defer></script></head>
<body><main class="page"><header class="page-header"><a class="back" href="/gestion-compte-bancaire" aria-label="Retour">‹</a><h1>Ajouter un compte de retrait</h1><span class="header-spacer"></span></header><div class="page-content">
<form class="wallet-form" data-wallet-form><label class="field-label" for="wallet-type">*Sélectionnez le type de portefeuille</label><select class="select" id="wallet-type" name="provider" required><option value="">Veuillez sélectionner</option><option value="TOGOCEL">TOGOCEL</option><option value="MOOV">Moov</option><option value="MTN">MTN</option><option value="ORANGE">Orange</option><option value="AIRTEL">Airtel</option><option value="WAVE">Wave</option></select>
<label class="field-label" for="wallet-holder">*Nom</label><input class="input" id="wallet-holder" name="holder_name" type="text" autocomplete="name" maxlength="120" placeholder="Veuillez entrer votre nom" required>
<label class="field-label" for="wallet-number">*Compte portefeuille</label><input class="input" id="wallet-number" name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="Numéro local ou avec l’indicatif de votre pays" required>
<button class="button-red button-wide wallet-submit" type="submit">Ajouter</button><p class="status" data-status role="status" aria-live="polite"></p></form></div></main></body></html>
