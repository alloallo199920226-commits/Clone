<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mon équipe — E-BIKE Pro</title>
  <link rel="stylesheet" href="/pages/pages.css">
  <link rel="stylesheet" href="/pages/team-reference.css">
  <link rel="stylesheet" href="/pages/narke-suite.css">
  <script src="/pages/narke-suite.js" defer></script>
  <script src="/pages/team.js" defer></script>
</head>
<body class="narke-suite-page narke-team-page narke-team-detail-page ebike-redesigned">
  <main class="page team-detail-page ebike-team-detail" data-team-page>
    <header class="page-header ebike-detail-header"><a class="back" href="/equipe" aria-label="Retour à l’équipe"><img src="/pages/assets/ebike-icon-chevron-right.png" alt="" aria-hidden="true"></a><div><span class="ebike-kicker">RÉSEAU DE PARRAINAGE</span><h1>Mon équipe</h1></div><span class="header-spacer"></span></header>
    <div class="ebike-level-intro"><h2>Activité par niveau</h2><p>Consultez les membres et les dépôts validés de votre réseau.</p></div>
    <nav class="team-level-tabs ebike-level-tabs" aria-label="Filtrer les membres par niveau">
      <button class="team-level-tab" type="button" data-team-level-tab="1" aria-selected="true"><span class="team-level-revenue" data-team-level-revenue>—</span><span>Niveau 1 (<span data-team-level-count="1">—</span>)</span></button>
      <button class="team-level-tab" type="button" data-team-level-tab="2" aria-selected="false"><span class="team-level-revenue" data-team-level-revenue>—</span><span>Niveau 2 (<span data-team-level-count="2">—</span>)</span></button>
      <button class="team-level-tab" type="button" data-team-level-tab="3" aria-selected="false"><span class="team-level-revenue" data-team-level-revenue>—</span><span>Niveau 3 (<span data-team-level-count="3">—</span>)</span></button>
    </nav>
    <section class="team-member-list ebike-member-list" data-team-members aria-live="polite"></section>
    <p class="team-detail-more" data-team-detail-more hidden>Les 100 membres les plus récents de chaque niveau sont affichés.</p>
    <div class="team-detail-empty" data-team-detail-empty hidden><img src="/pages/assets/empty-records.svg" alt="" aria-hidden="true"><span>Plus aucune donnée</span></div>
    <p class="team-detail-status" data-team-detail-error hidden role="status"></p>
  </main>
</body>
</html>
