<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Service client — SHINERAY</title>
  <link rel="stylesheet" href="/pages/pages.css">
  <link rel="stylesheet" href="/pages/reference.css">
</head>
<body>
  <main class="page reference-page service-page">
    <header class="page-header">
      <a class="back" href="/compte" aria-label="Retour au compte">‹</a>
      <h1>Service client</h1>
      <span class="header-spacer"></span>
    </header>
    <figure class="reference-crop service-banner">
      <img src="/pages/assets/service-t30.jpg" alt="Véhicule utilitaire SHINERAY T30" width="447" height="254">
    </figure>
    <div class="reference-hours">
      <strong>9:00-19:00</strong>
      <span>Horaires du service client</span>
    </div>
    <div class="reference-contact-list" aria-label="Contacts de service client">
        <button class="reference-contact" type="button" data-contact="Telegram">
        <span class="contact-main">
          <span class="reference-telegram" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false"><path d="M20.7 4.1 17.8 19c-.2 1-.8 1.2-1.6.7l-4.5-3.3-2.2 2.1c-.2.2-.4.4-.8.4l.3-4.6 8.4-7.6c.4-.3-.1-.5-.6-.2L6.4 13.1 2 11.7c-1-.3-1-1 .2-1.5L19.4 3.5c.8-.3 1.5.2 1.3.6Z"/></svg>
          </span>
          <span>Telegram</span>
        </span>
          <span class="contact-chevron" aria-hidden="true">›</span>
        </button>
        <button class="reference-contact" type="button" data-contact="Chaîne Telegram">
        <span class="contact-main">
          <span class="reference-telegram" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false"><path d="M20.7 4.1 17.8 19c-.2 1-.8 1.2-1.6.7l-4.5-3.3-2.2 2.1c-.2.2-.4.4-.8.4l.3-4.6 8.4-7.6c.4-.3-.1-.5-.6-.2L6.4 13.1 2 11.7c-1-.3-1-1 .2-1.5L19.4 3.5c.8-.3 1.5.2 1.3.6Z"/></svg>
          </span>
          <span>Chaîne Telegram</span>
        </span>
          <span class="contact-chevron" aria-hidden="true">›</span>
        </button>
        <button class="reference-contact" type="button" data-contact="Groupe Telegram">
        <span class="contact-main">
          <span class="reference-telegram" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false"><path d="M20.7 4.1 17.8 19c-.2 1-.8 1.2-1.6.7l-4.5-3.3-2.2 2.1c-.2.2-.4.4-.8.4l.3-4.6 8.4-7.6c.4-.3-.1-.5-.6-.2L6.4 13.1 2 11.7c-1-.3-1-1 .2-1.5L19.4 3.5c.8-.3 1.5.2 1.3.6Z"/></svg>
          </span>
          <span>Groupe Telegram</span>
        </span>
          <span class="contact-chevron" aria-hidden="true">›</span>
        </button>
    </div>
  </main>
  <dialog class="service-unavailable" id="service-unavailable"><h2>Contact indisponible</h2><p>Les liens de contact <span data-contact-name></span> ne sont pas configurés pour le moment.</p><button type="button" data-close-contact>Fermer</button></dialog>
  <script>
    const contactDialog = document.querySelector("#service-unavailable");
    document.querySelectorAll("[data-contact]").forEach((button) => button.addEventListener("click", () => {
      document.querySelector("[data-contact-name]").textContent = button.dataset.contact;
      contactDialog.showModal();
    }));
    document.querySelector("[data-close-contact]").addEventListener("click", () => contactDialog.close());
  </script>
</body>
</html>
