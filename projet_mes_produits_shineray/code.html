<!DOCTYPE html>

<html lang="fr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<title>Projet - Shineray</title>
<link rel="stylesheet" href="/pages/pages.css"/>
<script src="/pages/pages.js" defer></script>
<!-- Tailwind CSS CDN -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- BEGIN: CustomStyles -->
<style data-purpose="theme-gradient">
    /* Gradient rouge-noir pour les cartes de statistiques */
    .stat-card-gradient {
      background: linear-gradient(135deg, #ce0b1c 0%, #a80816 45%, #230205 100%);
    }
  </style>
<style data-purpose="mobile-layout">
    /* Empêche le rebond élastique et améliore le rendu mobile */
    body {
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    
    /* Support de la barre de navigation sur iOS */
    .safe-area-bottom {
      padding-bottom: env(safe-area-inset-bottom, 8px);
    }
  </style>
<!-- END: CustomStyles -->
</head>
<body class="bg-white text-gray-800 antialiased min-h-screen flex flex-col justify-between select-none">
<!-- BEGIN: MainContent -->
<main class="flex-1 pb-24" data-purpose="main-container">
<!-- BEGIN: HeroBanner -->
<!-- Image de bannière supérieure : SUV rouge et architecture moderne -->
<section class="w-full" data-purpose="hero-banner">
<img alt="Véhicule SUV rouge moderne Shineray" class="w-full h-auto block object-cover max-h-[260px] sm:max-h-[320px]" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCL99RZAtsHcKFOiYgeRn1sCYgns4L8R061dsesMuLinUJd_eZm0g_Ohlg9WBy2yJTTVCqzNQshODAG9R4iSi-DLMMWatymAkhEbtzFmyaemE2WZzOaXq_9wAHC2bjs3qDE1mazqj1git0-J62LYhrbnbj2NQ_t2IgmdzjETYKm7ifdJ0MOl0Ud9cyuLtgs-GQR-kRrNvNRqwaYOSSVMI07eZLxDwkylGG5WhhO3Crl0-I74jkqV8Bwss9AqUW5Cc4CP8o"/>
</section>
<!-- END: HeroBanner -->
<!-- BEGIN: StatsCardsSection -->
<!-- Grille des statistiques : Quantité achetée et Revenus -->
<section class="px-3.5 pt-3.5 pb-2" data-purpose="statistics-cards">
<div class="grid grid-cols-2 gap-3">
<!-- Carte Quantité achetée -->
<div class="stat-card-gradient rounded-md p-3.5 text-white shadow-sm flex flex-col justify-between min-h-[82px]" data-purpose="stat-quantity">
<span class="text-xs sm:text-sm font-medium tracking-wide">Mes achats</span>
<span class="text-base sm:text-lg font-bold mt-2" data-purchase-count>0</span>
</div>
<!-- Carte Mes revenus -->
<div class="stat-card-gradient rounded-md p-3.5 text-white shadow-sm flex flex-col justify-between min-h-[82px]" data-purpose="stat-revenue">
<span class="text-xs sm:text-sm font-medium tracking-wide">Montant total</span>
<span class="text-base sm:text-lg font-bold mt-2" data-purchase-total>FCFA 0</span>
</div>
</div>
</section>
<!-- END: StatsCardsSection -->
<!-- BEGIN: EmptyStateSection -->
<!-- Message centré en cas d'absence de produits achetés -->
<section class="py-24 px-6 text-center flex items-center justify-center" data-purpose="empty-state" data-activity-empty>
<p class="text-gray-900 text-sm sm:text-base font-normal tracking-wide">
        Vous n’avez encore aucun achat.
      </p>
</section>
<section class="px-4 pb-6" data-activity-list data-activity-kind="purchase" aria-live="polite"></section>
<!-- END: EmptyStateSection -->
</main>
<!-- END: MainContent -->
<!-- BEGIN: BottomNavigationBar -->
<!-- Barre de navigation inférieure fixe noire avec l'onglet Projet actif -->
<nav class="fixed bottom-0 inset-x-0 bg-[#121212] z-50 border-t border-neutral-800 safe-area-bottom" data-purpose="bottom-navigation">
<div class="max-w-md mx-auto flex items-center justify-around h-16 px-1">
<!-- Onglet 1: Maison -->
<a class="flex flex-col items-center justify-center flex-1 py-1 text-gray-400 hover:text-gray-200 transition-colors" data-purpose="nav-item-home" href="/accueil">
<!-- Icône Maison SVG -->
<svg class="w-6 h-6 mb-1 text-white fill-current" viewbox="0 0 24 24">
<path d="M12 2.1L1 12h3v9h6v-6h4v6h6v-9h3L12 2.1z"></path>
</svg>
<span class="text-[11px] leading-tight text-gray-400">Maison</span>
</a>
<!-- Onglet 2: Projet (Actif - Doré/Jaune) -->
<a class="flex flex-col items-center justify-center flex-1 py-1 text-[#f5b82e]" data-purpose="nav-item-project" href="/projet">
<!-- Icône Chariot de courses SVG -->
<svg class="w-6 h-6 mb-1 fill-current" viewbox="0 0 24 24">
<path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"></path>
</svg>
<span class="text-[11px] leading-tight font-semibold text-[#f5b82e]">Projet</span>
</a>
<!-- Onglet 3: Équipe -->
<a class="flex flex-col items-center justify-center flex-1 py-1 text-gray-400 hover:text-gray-200 transition-colors" data-purpose="nav-item-team" href="/equipe">
<!-- Icône 3 Étoiles SVG -->
<svg class="w-6 h-6 mb-1 fill-current text-gray-300" viewbox="0 0 24 24">
<!-- Étoile supérieure -->
<polygon points="12,1.5 13.5,6.5 18.5,6.5 14.5,9.5 16,14.5 12,11.5 8,14.5 9.5,9.5 5.5,6.5 10.5,6.5"></polygon>
<!-- Étoile inférieure gauche -->
<polygon points="6,12.5 7,16 10.5,16 7.5,18 8.5,21.5 6,19.5 3.5,21.5 4.5,18 1.5,16 5,16"></polygon>
<!-- Étoile inférieure droite -->
<polygon points="18,12.5 19,16 22.5,16 19.5,18 20.5,21.5 18,19.5 15.5,21.5 16.5,18 13.5,16 17,16"></polygon>
</svg>
<span class="text-[11px] leading-tight text-gray-400">Équipe</span>
</a>
<!-- Onglet 4: Le mien -->
<a class="flex flex-col items-center justify-center flex-1 py-1 text-gray-400 hover:text-gray-200 transition-colors" data-purpose="nav-item-profile" href="/compte">
<!-- Icône Profil Utilisateur SVG -->
<svg class="w-6 h-6 mb-1 fill-current text-gray-300" viewbox="0 0 24 24">
<path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"></path>
</svg>
<span class="text-[11px] leading-tight text-gray-400">Le mien</span>
</a>
</div>
</nav>
<!-- END: BottomNavigationBar -->
</body></html>
