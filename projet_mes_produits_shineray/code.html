<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
  <title>Mes produits — E-BIKE Pro</title>
  <link rel="stylesheet" href="/pages/pages.css">
  <link rel="stylesheet" href="/pages/records-reference.css">
  <link rel="stylesheet" href="/pages/narke-project.css">
  <script src="/pages/records-reference.js" defer></script>
</head>
  <body class="narke-project-body ebike-redesigned">
  <main class="page owned-project narke-project-page ebike-project-page" data-products-page>
    <section class="project-hero ebike-project-intro" aria-label="Mes produits E-BIKE Pro">
      <div class="ebike-project-intro-copy"><span class="ebike-kicker">VOTRE PARCOURS</span><h1>Mes produits</h1><p>Retrouvez vos offres actives et le détail de leurs revenus.</p></div>
      <div class="ebike-project-art" aria-hidden="true"><img src="/pages/assets/e-bike-product-black.jpg" alt=""><span>01 / E-BIKE PRO</span></div>
    </section>
    <section class="owned-stats ebike-product-metrics" aria-label="Mes statistiques">
      <div class="owned-stat" data-purpose="stat-quantity">
        <img src="/pages/assets/ebike-icon-bike.png" alt="" aria-hidden="true">
        <span class="owned-stat-label">Quantité achetée</span>
        <strong class="owned-stat-value" data-purchase-count>—</strong>
      </div>
      <div class="owned-stat" data-purpose="stat-revenue">
        <img src="/pages/assets/ebike-icon-wallet-cards.png" alt="" aria-hidden="true">
        <span class="owned-stat-label">Mes revenus</span>
        <strong class="owned-stat-value" data-purchase-total>—</strong>
      </div>
    </section>
    <section class="ebike-list-heading"><div><span class="ebike-kicker">PORTEFEUILLE</span><h2>Produits détenus</h2></div><span class="ebike-live-tag"><i></i> Données du compte</span></section>
    <section class="owned-product-list ebike-product-list" data-products-list aria-live="polite" aria-label="Mes produits" aria-busy="true"></section>
    <section class="empty-state owned-empty ebike-empty" data-products-empty hidden>
      <span class="empty-state-mark" aria-hidden="true">—</span>
      <strong>Aucun produit pour le moment</strong>
      <span>Vos VIP achetés ou octroyés apparaîtront ici.</span>
    </section>
    <p class="records-error" data-products-error role="alert" hidden></p>
  </main>
</body>
</html>
