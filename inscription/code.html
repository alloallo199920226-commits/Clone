<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f4f4">
  <title>Créer un compte — SHINERAY</title>
  <link rel="stylesheet" href="/inscription/auth.css">
</head>
<body>
  <main class="auth-page">
    <a class="back-link" href="/" aria-label="Retour à l’accueil">‹</a>
    <a class="brand" href="/" aria-label="SHINERAY accueil">
      <span class="brand-mark" aria-hidden="true">▰</span>
      <span class="brand-name">SH<span>/</span>INERAY</span>
      <span class="brand-divider"></span>
      <span class="brand-swm">SWM<small>ITALY · 1971</small></span>
    </a>

    <section class="auth-card" aria-labelledby="page-title">
      <h1 id="page-title" class="sr-only">Créer votre compte</h1>
      <form data-auth-form="signup">
        <label class="sr-only" for="signup-country">Pays</label>
        <button class="field country-trigger" id="signup-country" type="button" aria-haspopup="dialog" aria-expanded="false">
          <span data-country-label>Sélectionnez votre pays &gt;&gt;</span><span class="chevron" aria-hidden="true">⌄</span>
        </button>
        <input type="hidden" name="country" required>

        <label class="sr-only" for="signup-phone">Numéro de portable</label>
        <div class="phone-field">
          <span class="phone-prefix" data-phone-prefix aria-hidden="true"></span>
          <input class="field phone-input" id="signup-phone" name="phone" type="tel" inputmode="tel" autocomplete="tel-national" placeholder="Veuillez entrer votre numéro de portable" required>
        </div>

        <label class="sr-only" for="signup-password">Mot de passe</label>
        <input class="field" id="signup-password" name="password" type="password" autocomplete="new-password" placeholder="Mot de passe de connexion" aria-describedby="password-hint" minlength="8" required>
        <span class="sr-only" id="password-hint">8 caractères minimum</span>

        <label class="sr-only" for="signup-confirm">Répéter le mot de passe</label>
        <input class="field" id="signup-confirm" name="password-confirm" type="password" autocomplete="new-password" placeholder="Répéter le mot de passe" minlength="8" required>

        <label class="sr-only" for="signup-referral">Code de parrainage (facultatif)</label>
        <input class="field" id="signup-referral" name="referral_code" type="text" autocomplete="off" placeholder="Code de parrainage (facultatif)" minlength="6" maxlength="10" pattern="[A-Za-z0-9]{6,10}">

        <button class="primary-button" type="submit">Inscrivez-vous maintenant</button>
        <p class="switch-copy">Déjà inscrit ? <a href="/connexion">Connectez-vous</a></p>
      </form>
      <p class="demo-notice" role="status" aria-live="polite">Aucun SMS ni e-mail n’est demandé. Le numéro n’est pas vérifié et le mot de passe ne pourra pas être récupéré en cas d’oubli.</p>
    </section>
  </main>

  <div class="country-overlay" data-country-overlay hidden>
    <section class="country-sheet" role="dialog" aria-modal="true" aria-labelledby="country-title">
      <header class="sheet-header">
        <button type="button" class="sheet-back" data-country-close aria-label="Fermer">‹</button>
        <h2 id="country-title">Sélectionnez votre pays</h2>
        <span class="sheet-spacer"></span>
      </header>
      <div class="country-options">
        <button type="button" class="country-option" data-country-code="+228" data-country-name="Togo"><span>+228</span><span>Togo</span></button>
        <button type="button" class="country-option" data-country-code="+225" data-country-name="Côte d’Ivoire"><span>+225</span><span>Côte d’Ivoire</span></button>
      </div>
    </section>
  </div>
  <script src="/inscription/auth.js" defer></script>
</body>
</html>
