<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ed1218">
  <title>Créer un compte — E-BIKE Pro</title>
  <link rel="stylesheet" href="/inscription/auth.css">
  <link rel="stylesheet" href="/pages/narke-suite.css">
</head>
<body class="login-page signup-page ep-redesign">
  <main class="auth-page">
    <div class="hero-art">
      <img class="hero-image" src="/pages/assets/ebike-signature.jpg" alt="Vélo de l’univers illustratif E-BIKE Pro">
      <div class="ep-auth-brand"><span>E-BIKE <b>Pro</b></span><p>Votre prochain<br>point de départ.</p></div>
    </div>

    <section class="auth-card" aria-labelledby="page-title">
      <div class="profile-badge" aria-hidden="true">
        <svg viewBox="0 0 48 48" fill="none"><circle cx="24" cy="24" r="23" fill="#0844b9"/><circle cx="24" cy="17" r="7" fill="white"/><path d="M10.5 37.2c1.1-6.1 6.4-10.2 13.5-10.2s12.4 4.1 13.5 10.2v2.3h-27v-2.3Z" fill="white"/></svg>
      </div>
      <h1 id="page-title">Inscription</h1>
      <p class="auth-subtitle">Créez votre compte pour nous rejoindre</p>
      <form data-auth-form="signup">
        <label class="sr-only" for="signup-country">Pays</label>
        <label class="sr-only" for="signup-phone">Numéro de portable</label>
        <div class="field phone-field">
          <button class="country-trigger" id="signup-country" type="button" aria-haspopup="dialog" aria-controls="country-dialog" aria-expanded="false">
            <svg class="country-globe" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.4 2.5 3.5 5.5 3.5 9S14.4 18.5 12 21M12 3c-2.4 2.5-3.5 5.5-3.5 9S9.6 18.5 12 21"/></svg>
            <span class="country-choice"><span class="country-caption" aria-hidden="true">Pays</span><span class="country-selected"><span class="country-flag" data-country-flag aria-hidden="true">🇧🇯</span><span data-country-code-label>+229</span></span></span>
            <span class="sr-only" data-country-label>Bénin (+229)</span>
            <svg class="dropdown-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="m4 7 6 6 6-6"/></svg>
          </button>
          <input type="hidden" name="country" value="+229" required>
          <span hidden data-phone-prefix>+229</span>
          <span class="country-divider" aria-hidden="true"></span>
          <input class="field phone-input" id="signup-phone" name="phone" type="tel" inputmode="tel" autocomplete="tel-national" placeholder="Téléphone" required>
        </div>

        <label class="sr-only" for="signup-password">Mot de passe</label>
        <div class="field password-field">
          <span class="field-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none"><rect x="4.3" y="10" width="15.4" height="11" rx="1.8"/><path d="M7.7 10V7.4a4.3 4.3 0 0 1 8.6 0V10M12 14v3"/></svg>
          </span>
          <input class="field" id="signup-password" name="password" type="password" autocomplete="new-password" placeholder="Mot de passe" aria-describedby="password-hint" minlength="8" required>
          <button class="password-toggle" type="button" data-password-toggle aria-pressed="false" aria-controls="signup-password" aria-label="Afficher le mot de passe">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M2.5 12s3.4-6 9.5-6 9.5 6 9.5 6-3.4 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.8"/><path d="m4 4 16 16"/></svg>
          </button>
        </div>
        <span class="sr-only" id="password-hint">8 caractères minimum</span>

        <label class="sr-only" for="signup-confirm">Répéter le mot de passe</label>
        <div class="field password-field">
          <span class="field-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none"><rect x="4.3" y="10" width="15.4" height="11" rx="1.8"/><path d="M7.7 10V7.4a4.3 4.3 0 0 1 8.6 0V10M12 14v3"/></svg>
          </span>
          <input class="field" id="signup-confirm" name="password-confirm" type="password" autocomplete="new-password" placeholder="Confirmer le mot de passe" minlength="8" required>
          <button class="password-toggle" type="button" data-password-toggle aria-pressed="false" aria-controls="signup-confirm" aria-label="Afficher la confirmation du mot de passe">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M2.5 12s3.4-6 9.5-6 9.5 6 9.5 6-3.4 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.8"/><path d="m4 4 16 16"/></svg>
          </button>
        </div>

        <label class="sr-only" for="signup-referral">Code de parrainage (facultatif)</label>
        <div class="field referral-field">
          <input class="referral-input" id="signup-referral" name="referral_code" type="text" autocomplete="off" placeholder="Parrainage (facultatif)" minlength="6" maxlength="10" pattern="[A-Za-z0-9]{6,10}">
        </div>

        <button class="primary-button" type="submit">
          <span>Créer mon compte</span>
          <span class="submit-arrow" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M4.5 12h14m-6-6 6 6-6 6"/></svg></span>
        </button>
      </form>
      <p class="demo-notice" role="status" aria-live="polite"></p>
    </section>
    <footer class="signup-footer"><span>Déjà un compte&nbsp;?</span><a href="/connexion">Se connecter <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="m7 4 6 6-6 6"/></svg></a></footer>
  </main>

  <div class="country-overlay" data-country-overlay hidden>
    <section class="country-sheet" id="country-dialog" role="dialog" aria-modal="true" aria-labelledby="country-title" tabindex="-1">
      <header class="sheet-header">
        <button type="button" class="sheet-back" data-country-close aria-label="Fermer">‹</button>
        <h2 id="country-title">Sélectionnez votre pays</h2>
        <span class="sheet-spacer"></span>
      </header>
      <div class="country-loading" data-country-loading role="status" aria-live="polite">
        <span class="country-spinner" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></span>
        <span class="country-dots" aria-hidden="true"><span></span><span></span><span></span></span>
        <span class="sr-only">Ouverture de la liste des pays…</span>
      </div>
      <div class="country-options" hidden>
        <button type="button" class="country-option" data-country-code="+228" data-country-name="Togo"><span>+228</span><span>Togo</span></button>
        <button type="button" class="country-option" data-country-code="+225" data-country-name="Côte d’Ivoire"><span>+225</span><span>Côte d’Ivoire</span></button>
        <button type="button" class="country-option" data-country-code="+229" data-country-name="Bénin"><span>+229</span><span>Bénin</span></button>
        <button type="button" class="country-option" data-country-code="+226" data-country-name="Burkina Faso"><span>+226</span><span>Burkina Faso</span></button>
        <button type="button" class="country-option" data-country-code="+227" data-country-name="Niger"><span>+227</span><span>Niger</span></button>
        <button type="button" class="country-option" data-country-code="+237" data-country-name="Cameroun"><span>+237</span><span>Cameroun</span></button>
      </div>
      <div class="country-error" data-country-error hidden role="alert">
        <p data-country-message></p>
        <button type="button" data-country-retry>Réessayer</button>
      </div>
    </section>
  </div>
  <script src="/pages/country-picker.js" defer></script>
  <script src="/pages/auth-progress.js" defer></script>
  <script src="/inscription/auth.js" defer></script>
</body>
</html>
